name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - tree-sitter.json
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - tree-sitter.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Get pnpm store directory (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "STORE_PATH=$(nix-shell --run 'pnpm store path --silent')" >> $GITHUB_ENV

      - name: Get pnpm store directory (MacOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "STORE_PATH=$HOME/Library/Caches/pnpm/store" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Node.js dependencies
        run: nix-shell --run "pnpm install"

      - name: Run parser tests (tree-sitter test)
        run: nix-shell --run "pnpm run test"

      - name: Parse examples (tree-sitter parse)
        run: nix-shell --run "tree-sitter init-config || true; pnpm run examples"

      - name: Run Rust tests
        run: nix-shell --run "cargo test"

      - name: Run Go tests
        working-directory: bindings/go
        run: nix-shell ../../shell.nix --run "go get -t && go test -v"

      - name: Build Python binding
        run: nix-shell --run "python3 -m venv .venv && .venv/bin/pip install -e ."

      - name: Build Swift library
        if: runner.os == 'macOS'
        run: swift build
